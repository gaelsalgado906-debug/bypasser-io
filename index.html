<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Bypass</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e17;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e2e8f0;
  }
  .box {
    width: 100%;
    max-width: 520px;
    background: #0f172a;
    border: 1px solid #06b6d4;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 1.4rem;
    color: #22d3ee;
    text-align: center;
  }
  p {
    margin: 0 0 20px;
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #020617;
    color: #f1f5f9;
    font-size: 0.95rem;
    outline: none;
  }
  input:focus {
    border-color: #06b6d4;
  }
  button {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: #06b6d4;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover {
    background: #0891b2;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #status {
    margin-top: 14px;
    text-align: center;
    font-size: 0.9rem;
    color: #94a3b8;
    min-height: 22px;
  }
  #result {
    display: none;
    margin-top: 18px;
    padding: 14px;
    background: #020617;
    border-radius: 10px;
    border: 1px solid #1e293b;
    word-break: break-all;
  }
  #result.show {
    display: block;
  }
  #final {
    color: #22d3ee;
    margin-bottom: 12px;
    font-size: 0.95rem;
  }
  .btns {
    display: flex;
    gap: 8px;
  }
  .btns button {
    flex: 1;
    padding: 10px;
    font-size: 0.9rem;
  }
  .copy {
    background: transparent;
    border: 1px solid #06b6d4;
    color: #22d3ee;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Real Bypass</h1>
    <p>Linkvertise • Work.ink • LootLabs • Lockr y más</p>

    <div class="row">
      <input type="text" id="url" placeholder="Pega el link aquí...">
      <button id="btn" onclick="bypass()">Bypass</button>
    </div>

    <div id="status"></div>

    <div id="result">
      <div id="final"></div>
      <div class="btns">
        <button class="copy" onclick="copy()">Copiar</button>
        <button onclick="open()">Abrir</button>
      </div>
    </div>
  </div>

<script>
let link = "";

async function bypass() {
  const input = document.getElementById("url").value.trim();
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const btn = document.getElementById("btn");

  if (!input) {
    status.textContent = "Pega un link primero";
    return;
  }

  // Truco rápido Linkvertise
  if (input.includes("linkvertise.com")) {
    const lol = input.replace("linkvertise.com", "linkvertise.lol");
    status.textContent = "Redirigiendo con truco .lol...";
    window.open(lol, "_blank");
    return;
  }

  btn.disabled = true;
  status.textContent = "Bypasseando...";
  result.classList.remove("show");

  try {
    const res = await fetch("https://api.bypass.vip/bypass?url=" + encodeURIComponent(input));
    const data = await res.json();

    if (data.status === "success" && data.result) {
      link = data.result;
      document.getElementById("final").textContent = link;
      result.classList.add("show");
      status.textContent = "✓ Listo";
    } else {
      status.textContent = data.message || "No se pudo bypassar";
    }
  } catch (e) {
    status.textContent = "Error de conexión, intenta de nuevo";
  }

  btn.disabled = false;
}

function copy() {
  if (!link) return;
  navigator.clipboard.writeText(link);
  document.getElementById("status").textContent = "✓ Copiado";
}

function open() {
  if (link) window.open(link, "_blank");
}

document.getElementById("url").addEventListener("keydown", e => {
  if (e.key === "Enter") bypass();
});
</script>
</body>
</html>
